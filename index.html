<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="color-scheme" content="dark" />
  <title>Thanksgiving</title>
  <link rel="stylesheet" href="./styles.css?v=3.10.0" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
  <div id="app"><div class="boot">Loading Thanksgiving…</div></div>
  <script type="module" src="./app.js?v=3.10.0"></script>

<script>
(() => {
  const started = Date.now();
  const expectedVersion = '3.10.0';
  const timer = setInterval(() => {
    const app = document.getElementById('app');
    if (!app) return;
    const booted = document.documentElement.dataset.thanksgivingBooted === '1';
    const loadedVersion = document.documentElement.dataset.thanksgivingVersion || '';
    const stillLoading = /Loading Thanksgiving/i.test(app.textContent || '');
    if ((booted && loadedVersion === expectedVersion) || !stillLoading) {
      clearInterval(timer);
      return;
    }
    if (Date.now() - started > 12000) {
      clearInterval(timer);
      app.innerHTML = `
        <div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0b0b;color:white;font-family:system-ui">
          <div style="max-width:420px;padding:24px;border:1px solid #2b2b2b;border-radius:22px;background:#151515;text-align:center">
            <div style="font-size:34px;margin-bottom:10px">⚠️</div>
            <h2 style="margin:0 0 8px">Thanksgiving gagal memulai</h2>
            <p style="color:#aaa;line-height:1.5">Halaman tidak akan dibiarkan loading terus. Coba reload. Kalau tetap muncul, cek deploy terbaru.</p>
            <button onclick="location.reload()" style="margin-top:8px;padding:12px 18px;border:0;border-radius:14px;font-weight:800;cursor:pointer">Reload</button>
          </div>
        </div>`;
    }
  }, 500);
})();
</script>

</body>
</html>
